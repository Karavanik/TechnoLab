<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejestracja | TeconoLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="register">

  <div class="register-card">
    <a href="{{ url_for('index') }}" class="back-link" onclick="if (history.length > 1) { history.back(); return false; }">&larr; Wróć</a>
    <h1>Rejestracja</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="post">
      <label for="imie">Imie:</label>
      <input type="text" id="imie" name="imie" value="{{ imie or '' }}" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>

      <label for="haslo">Password:</label>
      <input type="password" id="haslo" name="haslo" required>

      <button type="submit">Załóż konto</button>
    </form>
  </div>

</body>
</html>
